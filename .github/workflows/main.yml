# MHR Switch Pak - builds an Android APK on GitHub.
# Put this file in your repo at: .github/workflows/build.yml
# It writes the whole app project by itself, so no other files are needed.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write app project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/mhrpak
          cat > settings.gradle <<'MHR_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MhrSwitchPak"
          include ':app'
          MHR_EOF
          cat > build.gradle <<'MHR_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          MHR_EOF
          cat > gradle.properties <<'MHR_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          MHR_EOF
          cat > app/build.gradle <<'MHR_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.mhrpak'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.mhrpak'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          MHR_EOF
          cat > app/src/main/AndroidManifest.xml <<'MHR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="MHR Switch Pak"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MHR_EOF
          cat > app/src/main/java/com/example/mhrpak/PakBuilder.java <<'MHR_EOF'
          package com.example.mhrpak;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          /**
           * Builds a Monster Hunter Rise "re_chunk_000.pak.patch_NNN.pak" from a PC mod zip.
           *
           * Does the same as the Windows chop.bat folder step (natives/STM -> natives/NSW)
           * and RisePakPatch.exe (KPKA v4 pak, files stored uncompressed, murmur3 name hashes).
           * It does NOT convert textures: PC .tex files from natives/STM are skipped.
           */
          public final class PakBuilder {

              public interface Log {
                  void line(String text);
              }

              public static final class Result {
                  public int files;
                  public int ignored;
                  public final List<String> skippedTextures = new ArrayList<>();
              }

              private static final class Entry {
                  int lower;
                  int upper;
                  long size;
              }

              private PakBuilder() {
              }

              public static Result build(InputStream zipStream, File tmp, OutputStream out, Log log)
                      throws IOException {
                  Result res = new Result();
                  List<Entry> entries = new ArrayList<>();
                  Set<String> seen = new HashSet<>();
                  byte[] buf = new byte[65536];

                  try (ZipInputStream zin = new ZipInputStream(new BufferedInputStream(zipStream));
                       OutputStream blob = new BufferedOutputStream(new FileOutputStream(tmp), 65536)) {
                      ZipEntry ze;
                      while ((ze = zin.getNextEntry()) != null) {
                          if (ze.isDirectory()) {
                              continue;
                          }
                          String name = ze.getName().replace('\\', '/');
                          int idx = findNatives(name.toLowerCase(Locale.ROOT));
                          if (idx < 0) {
                              res.ignored++;
                              continue;
                          }
                          String rel = name.substring(idx);
                          boolean fromStm = rel.toLowerCase(Locale.ROOT).startsWith("natives/stm/");
                          if (fromStm) {
                              rel = "natives/NSW/" + rel.substring("natives/stm/".length());
                          }
                          String relLower = rel.toLowerCase(Locale.ROOT);
                          if (fromStm && isTexture(relLower)) {
                              res.skippedTextures.add(rel);
                              continue;
                          }
                          if (!seen.add(relLower)) {
                              log.line("Duplicate ignored: " + rel);
                              continue;
                          }
                          long size = 0;
                          int n;
                          while ((n = zin.read(buf)) != -1) {
                              blob.write(buf, 0, n);
                              size += n;
                          }
                          Entry e = new Entry();
                          e.size = size;
                          e.lower = murmur3(relLower.getBytes(StandardCharsets.UTF_16LE), -1);
                          e.upper = murmur3(rel.toUpperCase(Locale.ROOT).getBytes(StandardCharsets.UTF_16LE), -1);
                          entries.add(e);
                          log.line("+ " + relLower);
                      }
                  }

                  if (entries.isEmpty()) {
                      throw new IOException("No files found inside a natives/ folder in this zip.");
                  }

                  int count = entries.size();
                  long dataStart = 16L + 48L * count;
                  ByteBuffer bb = ByteBuffer.allocate((int) dataStart).order(ByteOrder.LITTLE_ENDIAN);
                  bb.putInt(0x414B504B); // "KPKA"
                  bb.putInt(4);          // version 4.0
                  bb.putInt(count);
                  bb.putInt(0);
                  long offset = dataStart;
                  for (Entry e : entries) {
                      bb.putInt(e.lower);
                      bb.putInt(e.upper);
                      bb.putLong(offset);
                      bb.putLong(e.size);   // stored size
                      bb.putLong(e.size);   // uncompressed size
                      bb.putLong(0L);       // attributes: no compression
                      bb.putInt(0);         // checksum (unused)
                      bb.putInt(0);
                      offset += e.size;
                  }

                  BufferedOutputStream bo = new BufferedOutputStream(out, 65536);
                  bo.write(bb.array());
                  try (InputStream in = new FileInputStream(tmp)) {
                      int n;
                      while ((n = in.read(buf)) != -1) {
                          bo.write(buf, 0, n);
                      }
                  }
                  bo.flush();

                  res.files = count;
                  return res;
              }

              private static int findNatives(String lower) {
                  int i = 0;
                  while ((i = lower.indexOf("natives/", i)) >= 0) {
                      if (i == 0 || lower.charAt(i - 1) == '/') {
                          return i;
                      }
                      i++;
                  }
                  return -1;
              }

              // PC textures look like name.tex.28 (the number is the game's tex version)
              private static boolean isTexture(String lowerPath) {
                  int i = lowerPath.lastIndexOf(".tex.");
                  if (i < 0) {
                      return false;
                  }
                  String ext = lowerPath.substring(i + 5);
                  return !ext.isEmpty() && ext.matches("[0-9]+");
              }

              /** MurmurHash3 x86 32-bit, same as the MurMur3.dll used by RisePakPatch. */
              static int murmur3(byte[] d, int seed) {
                  int h = seed;
                  int len = d.length;
                  int blocks = len >>> 2;
                  for (int i = 0; i < blocks; i++) {
                      int p = i * 4;
                      int k = (d[p] & 0xff) | ((d[p + 1] & 0xff) << 8)
                              | ((d[p + 2] & 0xff) << 16) | ((d[p + 3] & 0xff) << 24);
                      k *= 0xcc9e2d51;
                      k = Integer.rotateLeft(k, 15);
                      k *= 0x1b873593;
                      h ^= k;
                      h = Integer.rotateLeft(h, 13);
                      h = h * 5 + 0xe6546b64;
                  }
                  int t = blocks << 2;
                  int k1 = 0;
                  switch (len & 3) {
                      case 3:
                          k1 ^= (d[t + 2] & 0xff) << 16;
                          // fall through
                      case 2:
                          k1 ^= (d[t + 1] & 0xff) << 8;
                          // fall through
                      case 1:
                          k1 ^= (d[t] & 0xff);
                          k1 *= 0xcc9e2d51;
                          k1 = Integer.rotateLeft(k1, 15);
                          k1 *= 0x1b873593;
                          h ^= k1;
                          break;
                      default:
                          break;
                  }
                  h ^= len;
                  h ^= h >>> 16;
                  h *= 0x85ebca6b;
                  h ^= h >>> 13;
                  h *= 0xc2b2ae35;
                  h ^= h >>> 16;
                  return h;
              }
          }
          MHR_EOF
          cat > app/src/main/java/com/example/mhrpak/MainActivity.java <<'MHR_EOF'
          package com.example.mhrpak;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.File;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final int REQ_PICK_ZIP = 1;
              private static final int REQ_SAVE_PAK = 2;

              private Uri zipUri;
              private TextView pickedView;
              private EditText numberView;
              private TextView logView;
              private ScrollView logScroll;
              private Button buildButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setTitle("MHR Switch Pak");

                  int pad = dp(16);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad, pad, pad);

                  TextView intro = new TextView(this);
                  intro.setText("Turns a Monster Hunter Rise PC mod (.zip with a natives folder) into a "
                          + "Switch re_chunk_000.pak.patch_NNN.pak file.\n"
                          + "PC textures (.tex) are NOT converted by this app.");
                  root.addView(intro);

                  Button pick = new Button(this);
                  pick.setText("1. Choose mod .zip");
                  pick.setOnClickListener(v -> pickZip());
                  root.addView(pick);

                  pickedView = new TextView(this);
                  pickedView.setText("No file chosen");
                  root.addView(pickedView);

                  TextView numLabel = new TextView(this);
                  numLabel.setText("\n2. Patch number (use the next free one, e.g. 016, 017):");
                  root.addView(numLabel);

                  numberView = new EditText(this);
                  numberView.setInputType(InputType.TYPE_CLASS_NUMBER);
                  numberView.setText("016");
                  root.addView(numberView);

                  buildButton = new Button(this);
                  buildButton.setText("3. Build .pak");
                  buildButton.setOnClickListener(v -> askOutputFile());
                  root.addView(buildButton);

                  logView = new TextView(this);
                  logView.setTextIsSelectable(true);
                  logView.setPadding(0, pad, 0, 0);
                  root.addView(logView);

                  logScroll = new ScrollView(this);
                  logScroll.addView(root);
                  setContentView(logScroll);
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private void log(final String text) {
                  runOnUiThread(() -> {
                      logView.append(text + "\n");
                      logScroll.post(() -> logScroll.fullScroll(View.FOCUS_DOWN));
                  });
              }

              private void pickZip() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i, REQ_PICK_ZIP);
              }

              private void askOutputFile() {
                  if (zipUri == null) {
                      log("Choose a mod .zip first.");
                      return;
                  }
                  String s = numberView.getText().toString().trim();
                  if (!s.matches("[0-9]{1,3}")) {
                      log("Patch number must be 1 to 3 digits.");
                      return;
                  }
                  String name = "re_chunk_000.pak.patch_"
                          + String.format(Locale.ROOT, "%03d", Integer.parseInt(s)) + ".pak";
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("application/octet-stream");
                  i.putExtra(Intent.EXTRA_TITLE, name);
                  startActivityForResult(i, REQ_SAVE_PAK);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != RESULT_OK || data == null || data.getData() == null) {
                      return;
                  }
                  Uri uri = data.getData();
                  if (requestCode == REQ_PICK_ZIP) {
                      zipUri = uri;
                      String n = displayName(uri);
                      pickedView.setText(n);
                      log("Selected: " + n);
                  } else if (requestCode == REQ_SAVE_PAK) {
                      startBuild(uri);
                  }
              }

              private String displayName(Uri uri) {
                  String result = uri.getLastPathSegment();
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int col = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (col >= 0) {
                              result = c.getString(col);
                          }
                      }
                  } catch (RuntimeException ignored) {
                      // keep fallback name
                  } finally {
                      if (c != null) {
                          c.close();
                      }
                  }
                  return result;
              }

              private void startBuild(final Uri outUri) {
                  final Uri inUri = zipUri;
                  buildButton.setEnabled(false);
                  log("Building... keep the app open.");
                  new Thread(() -> {
                      File tmp = null;
                      try (InputStream in = getContentResolver().openInputStream(inUri);
                           OutputStream out = getContentResolver().openOutputStream(outUri, "wt")) {
                          if (in == null || out == null) {
                              throw new IOException("Cannot open the selected files.");
                          }
                          tmp = File.createTempFile("pak", ".tmp", getCacheDir());
                          PakBuilder.Result r = PakBuilder.build(in, tmp, out, this::log);
                          log("");
                          log("DONE: " + r.files + " files packed.");
                          if (!r.skippedTextures.isEmpty()) {
                              log("WARNING: " + r.skippedTextures.size()
                                      + " PC texture file(s) were left out (they need Switch conversion):");
                              int shown = Math.min(5, r.skippedTextures.size());
                              for (int i = 0; i < shown; i++) {
                                  log("  - " + r.skippedTextures.get(i));
                              }
                              if (r.skippedTextures.size() > shown) {
                                  log("  ...and " + (r.skippedTextures.size() - shown) + " more");
                              }
                          }
                          log("Copy the .pak into your game's patch folder.");
                      } catch (Exception e) {
                          log("ERROR: " + e);
                      } finally {
                          if (tmp != null) {
                           
